# ─────────────────────────────────────────────────────────────────────────────
# Production stack.
#
#   prod:  docker compose -f compose.yml up -d --build
#   dev:   docker compose up --build     (auto-merges compose.yml + compose.override.yml)
# ─────────────────────────────────────────────────────────────────────────────
name: ${COMPOSE_PROJECT_NAME:-odin-app}

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: prod
    image: ${API_IMAGE_NAME:-api-app}:${API_IMAGE_TAG:-latest}
    container_name: ${API_CONTAINER_NAME:-api-app}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - odin-data:/app/apps/api/data
    environment:
      # absolute path → matches the volume mount above (cwd-independent)
      - DATABASE_URL=/app/apps/api/data/odin.db
      - AI_PROVIDER=${AI_PROVIDER:-mock}
      - PORT=3000
      # pass keys from shell/env file; a provider is only enabled when its key is non-empty
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: prod
      args:
        - VITE_API_URL=http://api:3000
    image: ${WEB_IMAGE_NAME:-web-app}:${WEB_IMAGE_TAG:-latest}
    container_name: ${WEB_CONTAINER_NAME:-web-app}
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  odin-data:
