services:
  api:
    build:
      context: ../apps/api
      dockerfile: Containerfile
    ports:
      - '3000:3000'
    volumes:
      - ../apps/api/src:/app/src
      - ../apps/api/data:/app/data
    environment:
      - DATABASE_URL=./data/odin.db
      - AI_PROVIDER=mock
    develop:
      watch:
        - action: sync
          path: ../apps/api/src
          target: /app/src
        - action: rebuild
          path: ../apps/api/package.json

  web:
    build:
      context: ../apps/web
      dockerfile: Containerfile
    ports:
      - '5173:5173'
    volumes:
      - ../apps/web/src:/app/src
    develop:
      watch:
        - action: sync
          path: ../apps/web/src
          target: /app/src
