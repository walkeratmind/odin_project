services:
  app:
    build:
      context: .
      dockerfile: Containerfile # OCI name; Docker, Podman, and Portainer all support this
    image: ${IMAGE_NAME:-react-app}:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-react-app}
    ports:
      - "${APP_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "com.docker.compose.project=${COMPOSE_PROJECT_NAME:-react-app}"
